<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    教育部標準國字直式注音規格與排版定位規範
  </text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="13.5" fill="#94a3b8">
    依教育部《國民小學作業簿規格》標準：字身為 1:1 正方形田字格，右側緊貼 2:5 (40%) 注音欄
  </text>

  <!-- Left Card: 二、三、四聲標準 (好 ㄏㄠˇ) -->
  <g transform="translate(40, 95)">
    <!-- Card Frame -->
    <rect width="385" height="375" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Card Tag & Title -->
    <rect x="22" y="20" width="118" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" />
    <text x="81" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">一般聲調 (二/三/四聲)</text>
    <text x="150" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="600" fill="#f8fafc">範例字：【好】ㄏㄠˇ</text>

    <!-- Dimension label at top -->
    <line x1="35" y1="65" x2="195" y2="65" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="35" y1="60" x2="35" y2="70" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="195" y1="60" x2="195" y2="70" stroke="#38bdf8" stroke-width="1.2" />
    <text x="115" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">國字字身 1:1 (2.0 cm)</text>

    <!-- Zhuyin width dim -->
    <line x1="195" y1="65" x2="259" y2="65" stroke="#f43f5e" stroke-width="1.2" />
    <line x1="259" y1="60" x2="259" y2="70" stroke="#f43f5e" stroke-width="1.2" />
    <text x="227" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">0.4倍 (0.8 cm)</text>

    <!-- Outer Box: Character + Zhuyin Flush -->
    <g transform="translate(35, 75)">
      <!-- Character Square Box (160x160) -->
      <rect x="0" y="0" width="160" height="160" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Red/Light Tian-zi-ge dashed crosslines -->
      <line x1="0" y1="80" x2="160" y2="80" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
      <line x1="80" y1="0" x2="80" y2="160" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
      <circle cx="80" cy="80" r="3" fill="#ef4444" opacity="0.7" />

      <!-- Chinese Character '好' - optically and mathematically centered -->
      <text x="80" y="80" font-family="'Noto Serif TC', 'Kaiti TC', 'BiauKai', 'DFKai-SB', serif" font-size="110" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">好</text>

      <!-- Attached Zhuyin Column (64x160) -->
      <rect x="160" y="0" width="64" height="160" fill="#090d16" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Zhuyin Guide Lines (Horizontal guide dashes) -->
      <line x1="160" y1="53" x2="224" y2="53" stroke="#334155" stroke-dasharray="2,2" />
      <line x1="160" y1="107" x2="224" y2="107" stroke="#334155" stroke-dasharray="2,2" />
      
      <!-- Center vertical guideline for zhuyin -->
      <line x1="188" y1="0" x2="188" y2="160" stroke="#334155" stroke-dasharray="3,3" />

      <!-- Zhuyin Symbols: ㄏ (聲母) & ㄠ (韻母) -->
      <text x="188" y="48" font-family="'Noto Sans TC', sans-serif" font-size="44" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="central">ㄏ</text>
      <text x="188" y="112" font-family="'Noto Sans TC', sans-serif" font-size="44" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="central">ㄠ</text>

      <!-- Tone Box for 3rd Tone (ˇ) in upper right margin -->
      <rect x="210" y="24" width="22" height="28" rx="3" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1.2" />
      <text x="221" y="38" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#f43f5e" text-anchor="middle" dominant-baseline="central">ˇ</text>

      <!-- Annotation arrow pointing to Tone -->
      <path d="M 233 38 L 265 38" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="265" cy="38" r="2.5" fill="#f43f5e" />
      <text x="272" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#f43f5e">二、三、四聲</text>
      <text x="272" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="10" fill="#cbd5e1">標於注音右上角</text>
    </g>

    <!-- Description Details -->
    <g transform="translate(24, 255)">
      <rect width="337" height="98" rx="8" fill="#0f172a" stroke="#334155" />
      <circle cx="20" cy="21" r="4" fill="#38bdf8" />
      <text x="30" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">排版重點特徵：</text>
      <text x="14" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">1. 國字正方居中：置中於田字格，邊緣預留約 15% 呼吸空間。</text>
      <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">2. 注音無縫相連：注音格緊靠字身右側，寬度為國字的 40%。</text>
      <text x="14" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">3. 聲調精準定錨：二三四聲絕不排在符號下方，固定於右上外緣。</text>
    </g>
  </g>

  <!-- Right Card: 輕聲標準 (的 ˙ㄉㄜ) -->
  <g transform="translate(455, 95)">
    <!-- Card Frame -->
    <rect width="385" height="375" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Card Tag & Title -->
    <rect x="22" y="20" width="95" height="24" rx="12" fill="rgba(251, 191, 36, 0.15)" />
    <text x="69.5" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">輕聲標準 (˙)</text>
    <text x="130" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="600" fill="#f8fafc">範例字：【的】˙ㄉㄜ</text>

    <!-- Dimension label at top -->
    <line x1="35" y1="65" x2="195" y2="65" stroke="#fbbf24" stroke-width="1.2" />
    <line x1="35" y1="60" x2="35" y2="70" stroke="#fbbf24" stroke-width="1.2" />
    <line x1="195" y1="60" x2="195" y2="70" stroke="#fbbf24" stroke-width="1.2" />
    <text x="115" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">國字字身 1:1 (2.0 cm)</text>

    <line x1="195" y1="65" x2="259" y2="65" stroke="#fbbf24" stroke-width="1.2" />
    <line x1="259" y1="60" x2="259" y2="70" stroke="#fbbf24" stroke-width="1.2" />
    <text x="227" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">0.4倍 (0.8 cm)</text>

    <!-- Outer Box: Character + Zhuyin Flush -->
    <g transform="translate(35, 75)">
      <!-- Character Square Box (160x160) -->
      <rect x="0" y="0" width="160" height="160" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Red/Light Tian-zi-ge dashed crosslines -->
      <line x1="0" y1="80" x2="160" y2="80" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
      <line x1="80" y1="0" x2="80" y2="160" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
      <circle cx="80" cy="80" r="3" fill="#ef4444" opacity="0.7" />

      <!-- Chinese Character '的' - optically and mathematically centered -->
      <text x="80" y="80" font-family="'Noto Serif TC', 'Kaiti TC', 'BiauKai', 'DFKai-SB', serif" font-size="110" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">的</text>

      <!-- Attached Zhuyin Column (64x160) -->
      <rect x="160" y="0" width="64" height="160" fill="#090d16" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Center vertical guideline for zhuyin -->
      <line x1="188" y1="0" x2="188" y2="160" stroke="#334155" stroke-dasharray="3,3" />

      <!-- Light Tone Dot: top center (˙) -->
      <circle cx="188" cy="18" r="5.5" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />

      <!-- Annotation arrow pointing to Light Tone -->
      <path d="M 197 18 L 265 18" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="265" cy="18" r="2.5" fill="#fbbf24" />
      <text x="272" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">輕聲符 (˙)</text>
      <text x="272" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="10" fill="#cbd5e1">標於注音最頂部正中央</text>

      <!-- Zhuyin Symbols: ㄉ & ㄜ evenly spaced below light tone -->
      <text x="188" y="65" font-family="'Noto Sans TC', sans-serif" font-size="42" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="central">ㄉ</text>
      <text x="188" y="120" font-family="'Noto Sans TC', sans-serif" font-size="42" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="central">ㄜ</text>
    </g>

    <!-- Description Details -->
    <g transform="translate(24, 255)">
      <rect width="337" height="98" rx="8" fill="#0f172a" stroke="#334155" />
      <circle cx="20" cy="21" r="4" fill="#fbbf24" />
      <text x="30" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">輕聲排版特徵：</text>
      <text x="14" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">1. 正中置頂：輕聲點佔據注音欄頂格，不佔右上角空間。</text>
      <text x="14" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">2. 符號向下順延：注音本體在輕聲點下方依序垂直置中排列。</text>
      <text x="14" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="11.5" fill="#cbd5e1">3. 第一聲無調號：陰平不標聲調，符號直接垂直居中。</text>
    </g>
  </g>
</svg>