name: Deploy to Firebase Hosting on PR

# Preview channel on the site the PR will eventually land on.
on:
  pull_request:
    branches:
      - main
      - release

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZHUYIN_APP }}
          projectId: zhuyin-app
          target: ${{ github.base_ref == 'release' && 'prod' || 'dev' }}
