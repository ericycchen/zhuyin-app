name: Deploy to Firebase Hosting on merge

# main    -> zhuyin-dev.web.app (dev)
# release -> zhuyin.web.app     (prod)
on:
  push:
    branches:
      - main
      - release

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests & PWA cache consistency checks
        run: node test.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZHUYIN_APP }}
          channelId: live
          projectId: zhuyin-app
          target: ${{ github.ref_name == 'release' && 'prod' || 'dev' }}
